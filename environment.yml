# conda env create -f environment.yml && conda activate vcs-slam
# then build the rasterizer:
#   pip install --no-build-isolation git+https://github.com/JonathonLuiten/diff-gaussian-rasterization-w-depth.git@cb65e4b86bc3bd8ed42174b72a62e8d3a3a71110
name: vcs-slam
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - nvidia/label/cuda-11.8.0::cuda-toolkit
  - pip
  - pip:
      - -r requirements.txt
